[project]
name = "cache-register"
version = "0.0.1"
description = "Receipts for the AI economy: reproducible analysis of public AI-market data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3",
    "duckdb>=1.5",
    "imageio-ffmpeg>=0.6",
    "pillow>=11",
    "polars>=1.44",
    "pyyaml>=6.0",
    "typer>=0.27",
    "vl-convert-python>=1.9",
]

[project.scripts]
cachereg = "cachereg.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]
# Motion-renderer spike only (docs/PLAN.md §6.3, candidate B). Uses the system Chrome.
spike = [
    "playwright>=1.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachereg"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # subprocess calls to git with fixed arguments are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/cachereg/cli.py" = ["B008"]  # typer.Argument/Option defaults are the idiom
"scripts/guard.py" = ["UP"]  # stays Python 3.9-compatible so the hook runs without an env

[tool.pytest.ini_options]
testpaths = ["tests"]
