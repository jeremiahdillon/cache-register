[project]
name = "cache-register"
version = "0.0.1"
description = "Receipts for the AI economy: reproducible analysis of public AI-market data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.27",
]

[project.scripts]
cachereg = "cachereg.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachereg"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # subprocess calls to git with fixed arguments are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/guard.py" = ["UP"]  # stays Python 3.9-compatible so the hook runs without an env

[tool.pytest.ini_options]
testpaths = ["tests"]
