# Source registry (docs/PLAN.md §2, §4.2). One entry per folder in src/cachereg/sources/.
#
# Fields:
#   id:             folder name under src/cachereg/sources/
#   history:        native | snapshot | curated
#   revisions:      none | append-only | revised          -> reproducibility class (§4.4)
#   redistribution: allowed | allowed-with-attribution | forbidden | unknown   (raw / inlined data)
#   derived_charts: allowed | allowed-with-attribution | forbidden | unknown   (images / video)
#   attribution:    exact credit string used by the footer stamp
#   cadence:        daily | weekly | monthly
#   requires:       secret names from .env.example, if any
#   enabled:        true | false
# Author policy (2026-10-05): derived works (charts, video, derived figures) may be published from
# every source, credited; only raw data is gated. So for redistribution `unknown` is treated as
# forbidden, while derived_charts blocks only when set to `forbidden` explicitly.

sources:
  - id: openrouter_rankings
    history: native
    revisions: revised
    redistribution: allowed-with-attribution
    derived_charts: allowed-with-attribution
    attribution: "OpenRouter (openrouter.ai/rankings), as of {as_of}"
    cadence: daily
    requires: [OPENROUTER_API_KEY]
    enabled: true

  - id: openrouter_models
    history: snapshot
    revisions: none
    # Verified 2026-10-04 (SOURCE.md): no licence is granted for /models; derived charts publish
    # only aggregated estimates, never the price list.
    redistribution: forbidden
    derived_charts: allowed-with-attribution
    attribution: "OpenRouter model pricing (openrouter.ai/models)"
    cadence: daily
    requires: []
    enabled: true

  - id: litellm_prices
    history: native
    revisions: none
    redistribution: allowed-with-attribution
    derived_charts: allowed-with-attribution
    attribution: "LiteLLM model prices (github.com/BerriAI/litellm, MIT)"
    cadence: daily
    requires: []
    enabled: true

  # Epoch AI (verified 2026-10-06, SOURCE.md): CC BY 4.0, revised in place with no version
  # history, so Latest-only (the same native + revised convention as openrouter_rankings).
  - id: epoch_benchmarks
    history: native
    revisions: revised
    redistribution: allowed-with-attribution
    derived_charts: allowed-with-attribution
    attribution: "Epoch AI, ‘Capabilities & benchmarking’ (epoch.ai/benchmarks), CC BY 4.0"
    cadence: weekly
    requires: []
    enabled: true

  - id: epoch_models
    history: native
    revisions: revised
    redistribution: allowed-with-attribution
    derived_charts: allowed-with-attribution
    attribution: "Epoch AI, ‘Data on AI models’ (epoch.ai/data/ai-models), CC BY 4.0"
    cadence: weekly
    requires: []
    enabled: true

  # SEC EDGAR (verified 2026-10-06, SOURCE.md): public information, may be copied with citation;
  # facts carry their filing date and restatements are new facts, so Exact.
  - id: sec_edgar
    history: native
    revisions: append-only
    redistribution: allowed
    derived_charts: allowed
    attribution: "SEC EDGAR XBRL financial data (sec.gov)"
    cadence: weekly
    requires: [SEC_EDGAR_USER_AGENT]
    enabled: true

  # OpenRouter session cost (verified 2026-10-07, SOURCE.md): CC BY 4.0. No date parameters:
  # only the current weekly snapshot (30-day window) can be fetched, so it is a snapshot source
  # (Author-only) and its history starts at our first fetch.
  - id: openrouter_session_cost
    history: snapshot
    revisions: none
    redistribution: allowed-with-attribution
    derived_charts: allowed-with-attribution
    attribution: "OpenRouter session cost by harness (openrouter.ai), as of {as_of}"
    cadence: weekly
    requires: [OPENROUTER_API_KEY]
    enabled: true
