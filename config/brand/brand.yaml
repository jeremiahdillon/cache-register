# Swappable brand settings. Every renderer reads from here (docs/PLAN.md §9).
name: Cache Register
tagline: Receipts for the AI economy
description: >-              # site meta / Open Graph description
  Reproducible analysis of public AI-market data. Every published visual links back to the
  exact code that made it.
repo_url: https://github.com/jeremiahdillon/cache-register
site_url: https://cacheregister.dev
short_link_host: cacheregister.dev     # footer links: <host>/<receipt folder name>  (GitHub Pages)
author_url: https://jeremiahdillon.com

colors:
  canvas: "#0A0B0F"
  panel: "#12141A"
  text: "#F2F4F8"
  text_secondary: "#B4BAC8"
  muted: "#5B6070"             # axes, grid, "everyone else"
  signal: "#C8FF2E"            # electric lime: the site accent, headline number and wordmark glyph
  accent: "#C8FF2E"            # the one highlighted series in an otherwise grey chart: the site's lime, so
                               # charts match cacheregister.dev (was signal orange #FF6A3D until 2026-10-10)
  # Categorical slots, fixed order. Validated 2026-10-02 with the dataviz validator on the
  # canvas (dark mode): lightness band PASS, chroma PASS, worst adjacent CVD ΔE 18.4,
  # normal-vision ΔE 24.2, contrast ≥ 3:1. Re-run the validator if any value changes.
  categorical:
    - "#12A7B4"                # cyan
    - "#EB6202"                # orange
    - "#F102B1"                # magenta
    - "#B98C10"                # gold
    - "#945FF9"                # violet
    - "#36B102"                # green
  # Colour follows the entity in every chart (never its rank).
  vendor_colors:
    openai: "#12A7B4"
    anthropic: "#EB6202"
    _china: "#F102B1"          # Chinese labs, when grouped
    google: "#B98C10"
    meta: "#945FF9"
    xai: "#36B102"

wordmark:                      # brand name at the top of every image / video / page
  color: "#F2F4F8"             # the text colour, as in the first receipt (author, 2026-10-10)
  glyph: true                  # the lime square before the name

fonts:                         # SIL OFL, vendored in assets/fonts for reproducible renders
  display: Space Grotesk
  body: Inter
  mono: JetBrains Mono
