# NAICS 2-digit sectors (2022 titles) and the labels sources use for them (PLAN §4.3).
# `aliases.ramp`: the sector names in the Ramp AI Index views (shortened NAICS titles).
# `aliases.btos`: Census BTOS sector codes (`31` = 31-33, `44` = 44-45, `48` = 48-49). BTOS has no 92
# (public administration is out of scope), its 11 excludes agriculture production, and its `XX`
# (multi-unit companies in several sectors) is in no sector and deliberately unmapped.
# `assumed: true` marks a mapping inferred from the label, not stated by the source.
sectors:
  "11":    {title: "Agriculture, Forestry, Fishing and Hunting", aliases: {btos: ["11"], ramp: ["Agriculture, Forestry, Fishing and Hunting"]}}
  "21":    {title: "Mining, Quarrying, and Oil and Gas Extraction", aliases: {btos: ["21"], ramp: ["Mining, Quarrying, and Oil and Gas Extraction"]}}
  "22":    {title: "Utilities", aliases: {btos: ["22"], ramp: ["Utilities"]}}
  "23":    {title: "Construction", aliases: {btos: ["23"], ramp: ["Construction"]}}
  "31-33": {title: "Manufacturing", aliases: {btos: ["31"], ramp: ["Manufacturing"]}}
  "42":    {title: "Wholesale Trade", aliases: {btos: ["42"], ramp: ["Wholesale Trade"]}}
  "44-45": {title: "Retail Trade", aliases: {btos: ["44"], ramp: ["Retail"]}}
  "48-49": {title: "Transportation and Warehousing", aliases: {btos: ["48"], ramp: ["Transportation and Warehousing"]}}
  # Ramp's "Technology and media" is taken to be Information (51); it may also hold parts of 54.
  "51":    {title: "Information", assumed: true, aliases: {btos: ["51"], ramp: ["Technology and media"]}}
  "52":    {title: "Finance and Insurance", aliases: {btos: ["52"], ramp: ["Finance and insurance"]}}
  "53":    {title: "Real Estate and Rental and Leasing", aliases: {btos: ["53"], ramp: ["Real Estate and Rental and Leasing"]}}
  "54":    {title: "Professional, Scientific, and Technical Services", aliases: {btos: ["54"], ramp: ["Professional, scientific, and technical services"]}}
  "55":    {title: "Management of Companies and Enterprises", aliases: {btos: ["55"], ramp: ["Management of Companies and Enterprises"]}}
  "56":    {title: "Administrative and Support and Waste Management and Remediation Services", aliases: {btos: ["56"], ramp: ["Administrative and Support and Waste Management and Remediation Services"]}}
  "61":    {title: "Educational Services", aliases: {btos: ["61"], ramp: ["Educational Services"]}}
  "62":    {title: "Health Care and Social Assistance", aliases: {btos: ["62"], ramp: ["Health care"]}}
  "71":    {title: "Arts, Entertainment, and Recreation", aliases: {btos: ["71"], ramp: ["Arts, Entertainment, and Recreation"]}}
  "72":    {title: "Accommodation and Food Services", aliases: {btos: ["72"], ramp: ["Accommodation and food services"]}}
  "81":    {title: "Other Services (except Public Administration)", aliases: {btos: ["81"], ramp: ["Other Services (except Public Administration)"]}}
  "92":    {title: "Public Administration", aliases: {ramp: ["Public Administration"]}}
