# Canonical models (PLAN §4.3, the models the marts join on). `model_id` is OpenRouter's
# current model id where one exists. `aliases.openrouter` lists rankings permaslugs (exact model
# versions); `aliases.litellm` lists LiteLLM price keys in preference order: OpenRouter's own
# listing first (`openrouter/<id>`), then the vendor's first-party key (dated before undated).
# `aliases.epoch` lists Epoch model groups (the ECI `Model` name); one group per model.
