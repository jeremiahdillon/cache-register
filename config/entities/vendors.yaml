# Canonical vendors (PLAN §4.3). `aliases` lists the author prefixes each source uses.
# `hq` is the country of the developer's headquarters (ISO 3166 alpha-2).
# Ids starting with "_" are not model makers (anonymous pre-release models, routers).
# `cachereg entities check` (Phase 3) reports prefixes that are not mapped here.
vendors:
  openai:           {name: OpenAI,                  open_weights: false, hq: US, aliases: {openrouter: [openai]}}
  anthropic:        {name: Anthropic,               open_weights: false, hq: US, aliases: {openrouter: [anthropic]}}
  google:           {name: Google,                  open_weights: false, hq: US, aliases: {openrouter: [google]}}
  xai:              {name: xAI,                     open_weights: false, hq: US, aliases: {openrouter: [x-ai]}}
  meta:             {name: Meta,                    open_weights: true,  hq: US, aliases: {openrouter: [meta-llama, meta]}}
  nvidia:           {name: NVIDIA,                  open_weights: true,  hq: US, aliases: {openrouter: [nvidia]}}
  microsoft:        {name: Microsoft,               open_weights: true,  hq: US, aliases: {openrouter: [microsoft]}}
  amazon:           {name: Amazon,                  open_weights: false, hq: US, aliases: {openrouter: [amazon]}}
  poolside:         {name: Poolside,                open_weights: false, hq: US, aliases: {openrouter: [poolside]}}
  arcee:            {name: Arcee AI,                open_weights: true,  hq: US, aliases: {openrouter: [arcee-ai]}}
  perplexity:       {name: Perplexity,              open_weights: false, hq: US, aliases: {openrouter: [perplexity]}}
  thinkingmachines: {name: Thinking Machines,       open_weights: false, hq: US, aliases: {openrouter: [thinkingmachines]}}
  mistral:          {name: Mistral,                 open_weights: true,  hq: FR, aliases: {openrouter: [mistralai]}}
  cohere:           {name: Cohere,                  open_weights: true,  hq: CA, aliases: {openrouter: [cohere]}}
  upstage:          {name: Upstage,                 open_weights: true,  hq: KR, aliases: {openrouter: [upstage]}}
  deepseek:         {name: DeepSeek,                open_weights: true,  hq: CN, aliases: {openrouter: [deepseek]}}
  alibaba:          {name: Alibaba (Qwen),          open_weights: true,  hq: CN, aliases: {openrouter: [qwen, alibaba]}}
  moonshot:         {name: Moonshot AI,             open_weights: true,  hq: CN, aliases: {openrouter: [moonshotai]}}
  zai:              {name: Z.ai,                    open_weights: true,  hq: CN, aliases: {openrouter: [z-ai, thudm]}}
  minimax:          {name: MiniMax,                 open_weights: true,  hq: CN, aliases: {openrouter: [minimax]}}
  xiaomi:           {name: Xiaomi,                  open_weights: true,  hq: CN, aliases: {openrouter: [xiaomi]}}
  tencent:          {name: Tencent,                 open_weights: true,  hq: CN, aliases: {openrouter: [tencent]}}
  stepfun:          {name: StepFun,                 open_weights: true,  hq: CN, aliases: {openrouter: [stepfun]}}
  ant:              {name: Ant Group (inclusionAI), open_weights: true,  hq: CN, aliases: {openrouter: [inclusionai]}}
  bytedance:        {name: ByteDance Seed,          open_weights: false, hq: CN, aliases: {openrouter: [bytedance-seed]}}
  _stealth:         {name: Stealth (unannounced),   open_weights: false, hq: null, aliases: {openrouter: [stealth]}}
  _router:          {name: OpenRouter routers,      open_weights: false, hq: null, aliases: {openrouter: [openrouter]}}
