name: ci

# Backstop only. We push straight to main; the local pre-push hook (.githooks/pre-push) is the gate.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Machine-specific literals for the guard; an encrypted secret so the patterns stay private.
      CACHEREG_GUARD_EXTRA: ${{ secrets.CACHEREG_GUARD_EXTRA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Guard and gitleaks (full history)
        run: |
          python3 scripts/guard.py --history
          scripts/gitleaks.sh git --redact --no-banner --exit-code 1 .
      - name: Lint and test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run ruff format --check
          uv run pytest -q
