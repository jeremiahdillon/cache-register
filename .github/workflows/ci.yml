name: ci

# Backstop only. Branches fast-forward main without PRs; the local pre-push hook (.githooks/pre-push) is the gate.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Machine-specific literals for the guard; an encrypted secret so the patterns stay private.
      CACHEREG_GUARD_EXTRA: ${{ secrets.CACHEREG_GUARD_EXTRA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Guard and gitleaks (full history)
        run: |
          python3 scripts/guard.py --history
          scripts/gitleaks.sh git --redact --no-banner --exit-code 1 .
      - name: Lint and test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run ruff format --check
          uv run pytest -q
      - name: Curated datasets are append-only
        # The pushed head is checked out; compare with the commit before the push (skipped when that is
        # all zeros or lacks the file).
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          uv run python -m cachereg.sources.curated_disclosures.dataset --base "$BEFORE"
          uv run python -m cachereg.sources.curated_asset_values.dataset --base "$BEFORE"
