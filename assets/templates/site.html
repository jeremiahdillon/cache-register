<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$description">
<meta name="theme-color" content="$canvas">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
$index_meta
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/$font_display" as="font" type="font/ttf" crossorigin>
<meta property="og:type" content="website">
<meta property="og:site_name" content="$name">
<meta property="og:title" content="$page_title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$site_url/">
<meta property="og:image" content="$site_url/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="$name: $tagline.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/site.css">
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(/assets/fonts/$font_display) format('truetype')}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(/assets/fonts/$font_body) format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/assets/fonts/$font_mono) format('truetype')}
:root{--canvas:$canvas;--panel:$panel;--ink:$text;--ink2:$text_secondary;--muted:$muted;--signal:$signal}
/* Intro: the cursor blinks alone, the title types in around it (each letter collapsed from load
   until its --t, then back to its own style: no fill, so no end-of-animation rounding), then
   everything else fades in together. Reduced motion shows the finished page. */
@media (prefers-reduced-motion:no-preference){
  h1 .k{animation:key var(--t) steps(1)}
  h1 .cursor{animation:blink 1.1s steps(1) infinite,hold ${typing_ms}ms steps(1) ${type_start_ms}ms}
  .reveal{animation:reveal .8s ease-out ${reveal_ms}ms both}
}
</style></head><body class="$body_class">
<main>
  <p class="kicker reveal">$kicker</p>
  <h1 aria-label="$heading">$heading_typed<span class="cursor" aria-hidden="true"></span></h1>
  <p class="lede reveal">$lede</p>
  $scroll_hint
</main>
$reel
<div class="end" id="end">
  <p class="note reveal">$description</p>
  <a class="cta reveal" href="$repo_url">$github_icon$repo_label</a>
  <footer class="reveal">
    <div class="tear" aria-hidden="true">&#9986;</div>
    <div class="line"><span>$name</span><span class="dots" aria-hidden="true"></span><a href="$author_url">$author_label</a></div>
  </footer>
</div>
</body></html>
