<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="$muted" fill-opacity="0.35"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="$canvas" stop-opacity="0"/>
      <stop offset="0.8" stop-color="$canvas" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="$canvas"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <text x="600" y="296" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="132"
        letter-spacing="-5.5" fill="$text">$name</text>
  <text x="600" y="376" text-anchor="middle" font-family="Inter" font-size="38" fill="$text_secondary">$tagline<tspan fill="$signal">.</tspan></text>
  <line x1="240" y1="520" x2="960" y2="520" stroke="$muted" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="240" y="566" font-family="JetBrains Mono" font-size="22" letter-spacing="3" fill="$muted">$name_upper</text>
  <text x="960" y="566" text-anchor="end" font-family="JetBrains Mono" font-size="22" letter-spacing="3" fill="$text_secondary">$host_upper</text>
</svg>
