<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$page_description">
<meta name="theme-color" content="$canvas">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="$canonical">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="article">
<meta property="og:site_name" content="$name">
<meta property="og:title" content="$page_title">
<meta property="og:description" content="$page_description">
<meta property="og:url" content="$canonical">
<meta property="og:image" content="$card_url">
<meta property="og:image:width" content="$card_width">
<meta property="og:image:height" content="$card_height">
<meta property="og:image:alt" content="$title">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/site.css">
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(/assets/fonts/$font_display) format('truetype')}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(/assets/fonts/$font_body) format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/assets/fonts/$font_mono) format('truetype')}
:root{--canvas:$canvas;--panel:$panel;--ink:$text;--ink2:$text_secondary;--muted:$muted;--signal:$signal}
</style></head><body class="reel page">
<header class="bar">
  <a class="home" href="/">$name</a>
  <span class="title"><b>$title</b> · As of $as_of</span>
  <a class="src" href="$source_url">Source on GitHub <span aria-hidden="true">↗</span></a>
</header>
<div class="slides" role="main">
$slides
</div>
<div class="end">
  <p class="note">$description</p>
  <a class="cta" href="$source_url">$github_icon Source on GitHub</a>
  <a class="back" href="/">← All receipts</a>
  <footer>
    <div class="tear" aria-hidden="true">&#9986;</div>
    <div class="line"><span>$name</span><span class="dots" aria-hidden="true"></span><a href="$author_url">$author_label</a></div>
  </footer>
</div>
<script src="/assets/reel.js" defer></script>
</body></html>
