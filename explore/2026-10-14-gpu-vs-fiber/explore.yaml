# Exploration config (same schema as receipt.yaml). Design: docs/plans/2026-10-14-gpu-vs-fiber.md.
# Every point comes from a row of the curated_asset_values mart, picked here by id, so each one can be
# traced to its cited quote. `per: 8` divides an 8-GPU instance's price to a per-GPU price.
title: GPUs vs dark fiber, value after a bust
sources: [curated_asset_values, sec_edgar]
config:
  # 1. Price paths: each series as % of its own first quote, by years since that quote.
  prices:
    - name: US IP transit, per Mbps
      era: dotcom
      ids: [lit_bandwidth-bandwidth_price-2014-01-01, lit_bandwidth-bandwidth_price-2014-01-01-2,
            lit_bandwidth-bandwidth_price-2014-01-01-3, lit_bandwidth-bandwidth_price-2014-01-01-4,
            lit_bandwidth-bandwidth_price-2014-01-01-5]
    - name: OC-3 circuit, New York–LA
      era: dotcom
      ids: [lit_bandwidth-bandwidth_price-2003-04-14, lit_bandwidth-bandwidth_price-2003-04-14-2,
            lit_bandwidth-bandwidth_price-2003-04-14-3, lit_bandwidth-bandwidth_price-2003-04-14-4]
    - name: H100, market rate
      era: ai
      # launch-era and early-2024 quotes (Latent Space), then Silicon Data's neocloud H100 index: two sources
      ids: [gpu_h100-rental_price-2024-10-11-2, gpu_h100-rental_price-2024-10-11-3,
            gpu_h100-rental_price-2025-10-20, gpu_h100-rental_price-2026-01-09,
            gpu_h100-rental_price-2026-01-09-2, gpu_h100-rental_price-2026-06-16-2]
    - name: H100, Lambda on-demand
      era: ai
      ids: [{id: gpu_h100-rental_price-2024-07-11, per: 8}, gpu_h100-rental_price-2025-01-01,
            gpu_h100-rental_price-2026-03-10, gpu_h100-rental_price-2026-10-01]
    - name: A100, Lambda on-demand
      era: ai
      ids: [{id: gpu_a100-rental_price-2023-06-14, per: 8}, {id: gpu_a100-rental_price-2024-07-11, per: 8},
            gpu_a100-rental_price-2026-01-09, gpu_a100-rental_price-2026-10-01]
    - name: V100, Lambda on-demand
      era: ai
      ids: [{id: gpu_v100-rental_price-2022-06-13, per: 8}, gpu_v100-rental_price-2026-01-09,
            gpu_v100-rental_price-2026-10-01]
  # 2. Book useful lives, by group (a range is its low and high rows; a single figure is one row).
  lives:
    - group: AI servers and GPUs, 2025–26
      short: GPU servers and network gear
      highlight: true
      lifespan: short
      era: ai
      ids: [gpu_generic-book_useful_life-2026-07-29, gpu_generic-book_useful_life-2026-07-29-2,
            gpu_generic-book_useful_life-2026-02-05, gpu_generic-book_useful_life-2026-02-06,
            gpu_generic-book_useful_life-2026-02-06-2, gpu_generic-book_useful_life-2025-01-30-3,
            gpu_generic-book_useful_life-2026-06-22, gpu_generic-book_useful_life-2026-03-02-3,
            gpu_generic-book_useful_life-2026-04-30]
    - group: Dot-com network electronics, 2000–01
      short: Network electronics
      lifespan: short
      era: dotcom
      ids: [fiber_electronics-book_useful_life-2002-03-13, fiber_electronics-book_useful_life-2002-03-13-2,
            fiber_electronics-book_useful_life-2002-03-19, fiber_electronics-book_useful_life-2002-03-19-2,
            fiber_electronics-book_useful_life-2002-04-01, fiber_electronics-book_useful_life-2002-04-01-2,
            fiber_electronics-book_useful_life-2002-04-01-3, fiber_electronics-book_useful_life-2002-04-01-4]
    - group: Dot-com fiber, conduit and rights-of-way
      short: Fiber, conduit and rights-of-way
      highlight: true
      tag: the glass
      lifespan: long
      era: dotcom
      ids: [dark_fiber-book_useful_life-2001-05-22, dark_fiber-book_useful_life-2001-05-22-2,
            dark_fiber-book_useful_life-2002-03-19, dark_fiber-book_useful_life-2002-03-19-2,
            dark_fiber-book_useful_life-2002-04-01, dark_fiber-book_useful_life-2002-04-01-2,
            dark_fiber-book_useful_life-2002-04-01-3, dark_fiber-book_useful_life-2002-04-01-4,
            dark_fiber-book_useful_life-2002-04-01-5, dark_fiber-book_useful_life-2002-04-01-6]
    - group: Data-centre buildings, 2024–26
      short: Data-centre buildings
      tag: the powered shell
      lifespan: long
      era: ai
      ids: [dc_shell-book_useful_life-2026-02-11, dc_shell-book_useful_life-2026-02-11-2,
            dc_shell-book_useful_life-2026-02-13, dc_shell-book_useful_life-2026-02-13-2,
            dc_shell-book_useful_life-2026-02-05, dc_shell-book_useful_life-2026-02-05-2,
            dc_shell-book_useful_life-2025-01-30, dc_shell-book_useful_life-2025-01-30-2,
            dc_shell-book_useful_life-2026-07-29, dc_shell-book_useful_life-2026-07-29-2]
    - group: Power plants and grid, FY2025
      short: Power plants and grid
      lifespan: long
      era: ai
      # stated total lives only: Constellation gas; Dominion nuclear and other generation; AEP, AEP Texas and AEP
      # Transmission Co transmission and distribution; Exelon transmission and distribution. Left out: remaining
      # lives (Vistra, Duke), Talen's fresh-start basis, Entergy's tax-note average, AEP's 20-162-year generation
      # range, 'up to' figures (Southern Power) and wind and solar.
      ids: [power-book_useful_life-2026-02-12-10, power-book_useful_life-2026-02-12-7,
            power-book_useful_life-2026-02-12-8, power-book_useful_life-2026-02-12-9,
            power-book_useful_life-2026-02-12-11, power-book_useful_life-2026-02-12-12,
            power-book_useful_life-2026-02-12-3, power-book_useful_life-2026-02-12-4,
            power-book_useful_life-2026-02-12-5, power-book_useful_life-2026-02-12-6,
            power-book_useful_life-2026-02-24, power-book_useful_life-2026-02-24-2,
            power-book_useful_life-2026-02-23, power-book_useful_life-2026-02-23-2,
            power-book_useful_life-2026-02-23-3, power-book_useful_life-2026-02-23-4,
            power-book_useful_life-2026-02-12-13, power-book_useful_life-2026-02-12-14]
  # 3. What dot-com networks fetched: one track per company, in date order.
  recovery:
    - company: Global Crossing
      ids: [fiber_network-capital_invested-2023-11-14, fiber_network-debt_at_bankruptcy-2002-08-11,
            fiber_network-distressed_sale_price-2002-08-11, fiber_network-deal_value-2023-11-14]
    - company: Williams Communications
      ids: [fiber_network-debt_at_bankruptcy-2002-10-16, fiber_network-deal_value-2005-11-01]
    - company: Velocita
      ids: [fiber_network-capital_invested-2002-11-11, fiber_network-debt_at_bankruptcy-2002-11-11,
            fiber_network-distressed_sale_price-2002-11-11]
    - company: FLAG Telecom
      ids: [fiber_network-debt_at_bankruptcy-2003-10-20, fiber_network-distressed_sale_price-2003-10-16]
  # 4. Old GPUs cost more: Lambda's on-demand price per GPU-hour (8-GPU instances), January vs October 2026.
  ladder:
    - {gpu: V100, from: gpu_v100-rental_price-2026-01-09, to: gpu_v100-rental_price-2026-10-01}
    - {gpu: A100, from: gpu_a100-rental_price-2026-01-09, to: gpu_a100-rental_price-2026-10-01}
    - {gpu: H100, from: gpu_h100-rental_price-2026-01-09-3, to: gpu_h100-rental_price-2026-10-01}
    - {gpu: B200, from: gpu_b200-rental_price-2026-01-09, to: gpu_b200-rental_price-2026-10-01}
  # 5. On the books, behind: each generation from NVIDIA's announcement (the cited release's date) over a
  # six-year book life (the servers' life at Microsoft, Alphabet, Oracle and CoreWeave, and the GPU
  # collateral's in CoreWeave's DDTL 2.0 loan).
  book_life_years: 6
  book_life_ids: [gpu_generic-book_useful_life-2026-03-02-3, gpu_generic-book_useful_life-2025-03-03]
  launches:
    - {gpu: A100, id: gpu_a100-perf_multiple-2020-05-14}
    - {gpu: H100, id: gpu_h100-perf_multiple-2022-03-22}
    - {gpu: Blackwell, id: gpu_b200-perf_per_dollar-2024-03-18}
    - {gpu: Rubin, id: gpu_rubin-perf_per_dollar-2026-01-05}
  # 6. The 2001 signal: price paths in the first years after each series' first quote.
  glut_series: ["OC-3 circuit, New York–LA", "US IP transit, per Mbps", "H100, market rate"]
  glut_years: 7
  glut_utilization_id: lit_bandwidth-utilization-2001-07-19
  # 7. Who gets the glass: cash and short-term investments vs debt (mart 111), latest balance sheets.
  buyers: [GOOGL, AMZN, META, MSFT, NVDA, ORCL, CRWV]
  # 8. How much is glass: gross property and equipment by class, latest 10-K, in three buckets.
  glass_companies: [Microsoft, Alphabet, Amazon, Meta, Oracle, CoreWeave]
  # Kinds of property: gear (short-lived electronics), glass (fiber, conduit, rights-of-way: the dot-com
  # long-lived plant), buildings (the carriers'), shell (the AI powered shell: land and buildings), mixed
  # (construction in progress, lines that lump kinds, other equipment).
  kinds:
    gpu_generic: gear
    fiber_electronics: gear
    dark_fiber: glass
    carrier_buildings: buildings
    land: shell
    dc_shell: shell
    construction_in_progress: mixed
    other_ppe: mixed
    carrier_mixed: mixed
  # Lines split by the company's own stated mix (drawn as estimates): Alphabet says about 60% of its
  # technical-infrastructure investment goes to servers and 40% to data centres and networking equipment.
  allocate:
    - {company: Alphabet, line: Technical infrastructure, gear: 0.6, shell: 0.4}
  # 9. Where each era's money went: the carriers that report fiber and electronics apart, at the peak of the
  # build-out (year-end 2000, additions over 2000), against the AI companies' latest year.
  split_dotcom:
    carriers: [Level 3, Williams Communications, Genuity, Metromedia Fiber Network, Touch America]
    now: 2000-12-31
    prior: 1999-12-31
visuals:
  - {name: years, chart: years, targets: [x_png, linkedin_png, x_video, linkedin_video, blog_html], sources: [curated_asset_values]}
  - {name: split, chart: split, targets: [x_png, linkedin_png, x_video, linkedin_video, blog_html], sources: [curated_asset_values]}
  - name: exposure
    chart: exposure
    targets: [x_png, linkedin_png, x_video, linkedin_video, blog_html]
    sources: [curated_asset_values, sec_edgar]
  - {name: book-life, chart: book_life, targets: [x_png, linkedin_png, blog_html], sources: [curated_asset_values]}
  - {name: ladder, chart: ladder, targets: [x_png, linkedin_png, blog_html], sources: [curated_asset_values]}
  - {name: glut, chart: glut, targets: [x_png, linkedin_png, blog_html], sources: [curated_asset_values]}
  - {name: recovery, chart: recovery, targets: [x_png, linkedin_png, blog_html], sources: [curated_asset_values]}
  - {name: buyers, chart: buyers, targets: [x_png, linkedin_png, blog_html], sources: [sec_edgar]}
