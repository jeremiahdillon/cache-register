# Exploration config (same schema as receipt.yaml). Prompted by the author on 2026-11-05, as a companion to
# explore/2026-11-05-chip-selloff: every member of the PHLX Semiconductor Index, then the index itself.
# Yahoo's data is redistribution-forbidden, so there is no blog_html (it would inline the data) and no data.json.
title: The SOX and its 30 members
link: sox-wave   # reserved short link (cacheregister.dev/sox-wave), stamped on the visuals
sources: [yahoo_prices, yahoo_intraday]
config:
  headline: "All {total} stocks in the SOX chip index fell\nin the two days after the midterms"
  first_session: 2026-11-04
  session: 2026-11-05
  index: {ticker: ^SOX, name: SOX index}
  label: [QCOM, NVDA, AVGO, TSM, INTC, AMD, MU, CRDO]  # recognizable names and the largest drop; the index is always named
  members:               # Nasdaq's weighting page for SOX, 2026-11-05, supplied by the author
    - {ticker: AMD, name: AMD}
    - {ticker: ADI, name: Analog Devices}
    - {ticker: AMAT, name: Applied Materials}
    - {ticker: ARM, name: Arm}
    - {ticker: ASML, name: ASML}
    - {ticker: ALAB, name: Astera Labs}
    - {ticker: AVGO, name: Broadcom}
    - {ticker: COHR, name: Coherent}
    - {ticker: CRDO, name: Credo}
    - {ticker: ENTG, name: Entegris}
    - {ticker: GFS, name: GlobalFoundries}
    - {ticker: INTC, name: Intel}
    - {ticker: KLAC, name: KLA}
    - {ticker: LRCX, name: Lam Research}
    - {ticker: LSCC, name: Lattice}
    - {ticker: MTSI, name: MACOM}
    - {ticker: MRVL, name: Marvell}
    - {ticker: MCHP, name: Microchip}
    - {ticker: MU, name: Micron}
    - {ticker: MPWR, name: Monolithic Power}
    - {ticker: NVDA, name: Nvidia}
    - {ticker: NXPI, name: NXP}
    - {ticker: "ON", name: ON Semiconductor}
    - {ticker: Q, name: Qnity}
    - {ticker: QCOM, name: Qualcomm}
    - {ticker: SITM, name: SiTime}
    - {ticker: TSM, name: TSMC}
    - {ticker: TER, name: Teradyne}
    - {ticker: TXN, name: Texas Instruments}
    - {ticker: TSEM, name: Tower}
visuals:
  # Footer credit: yahoo_intraday's line covers both Yahoo sources (same provider, same terms), on one line.
  - {name: members, chart: members, targets: [x_png, linkedin_png, x_video, linkedin_video], sources: [yahoo_intraday]}
