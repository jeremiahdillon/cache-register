# Exploration config (same schema as receipt.yaml; no short link — explorations never get one).
title: Capex vs price collapse
sources: [sec_edgar, epoch_benchmarks, litellm_prices]
config:
  group: hyperscaler       # tickers.yaml group whose capex is summed (030_capex)
  start: 2025-01-01        # LiteLLM price history is staged from this day
  levels:                  # Epoch Capabilities Index thresholds, as in the cost-of-intelligence exploration
    - {eci: 130, name: Claude 3.5 Sonnet-level}
    - {eci: 140, name: o1-level}
    - {eci: 150, name: GPT-5-level}
  headline_level: 140      # the highest level reached before the first capex quarter in the window
visuals:
  - {name: panels, chart: panels, targets: [x_png, linkedin_png, blog_html]}
