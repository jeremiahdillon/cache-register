# Exploration config (same schema as receipt.yaml). Prompted by the author on
# 2026-11-04, after same-day coverage of hyperscalers rising and data center stocks falling on the midterm results.
# Yahoo's data is redistribution-forbidden, so there is no blog_html (it would inline the data) and no data.json.
title: Election-day split in AI stocks
link: midterm-split   # reserved short link (cacheregister.dev/midterm-split), stamped on the visuals
sources: [yahoo_prices, yahoo_intraday]
config:
  headline: "Hyperscalers rose and data center suppliers fell\nthe day after the midterms"
  session: 2026-11-04
  baseline: {ticker: SPY, name: S&P 500 (SPY)}
  notes:                 # on-screen narration, shown once each group has drawn; {baseline} is the S&P's move
    baseline: "The broad market rose {baseline:.1f}%."
    rose: Hyperscalers rose on bets that a slower buildout will temper their capex.
    fell: The supply chain fell on fears that a slower buildout will cut demand.
  rose:
    - {ticker: MSFT, name: Microsoft}
    - {ticker: AMZN, name: Amazon}
    - {ticker: GOOGL, name: Alphabet}
  fell:
    - {ticker: VST, name: Vistra}
    - {ticker: VRT, name: Vertiv}
    - {ticker: PWR, name: Quanta Services}
    - {ticker: CRWV, name: CoreWeave}
    - {ticker: GEV, name: GE Vernova}
visuals:
  # Footer credit: yahoo_intraday's line covers both Yahoo sources (same provider, same terms), on one line.
  - {name: session, chart: session, targets: [x_png, linkedin_png, x_video, linkedin_video], sources: [yahoo_intraday]}
