# Exploration config (same schema as receipt.yaml). `link:` reserves a short link before promotion (PLAN §5).
# Design: docs/plans/2026-10-10-anthropic-share-by-source.md. No blog_html: Ramp's redistribution is unknown,
# so nothing inlines its data.
title: Anthropic's share of AI spend and tokens, by data source
sources: [ramp_ai_index, vercel_ai_gateway, openrouter_rankings, litellm_prices]
link: source-matters   # reserved short link (cacheregister.dev/source-matters), stamped on the visuals
config:
  start: null   # null = each source from its first week; or YYYY-MM-DD to start every line there
  min_days: 6    # a gateway week needs this many days of data (OpenRouter misses 2025-06-15 and 2025-07-15)
visuals:
  - {name: spend, chart: spend, targets: [x_png, linkedin_png]}
  # token views use no prices, so they credit no LiteLLM
  - name: tokens
    chart: tokens
    targets: [x_png, linkedin_png]
    sources: [ramp_ai_index, vercel_ai_gateway, openrouter_rankings]
  - name: tokens-with-free
    chart: tokens_with_free
    targets: [x_png, linkedin_png, x_video, linkedin_video, web_video]
    sources: [ramp_ai_index, vercel_ai_gateway, openrouter_rankings]
