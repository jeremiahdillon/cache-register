# Exploration config (same schema as receipt.yaml; `link:` reserves the short link the receipt will take).
title: Frontier by lab vs the best open-weight model
link: open-leaps-ahead   # reserved short link (cacheregister.dev/open-leaps-ahead), stamped on the visuals; for the Terminal-Bench receipt
as_of: 2026-10-23
sources: [artificial_analysis]
config:
  start:                       # window start per visual; each line enters at the record it held then
    intelligence: 2025-01-01
    terminal-bench: 2026-01-01 # Terminal-Bench 4.0 scores are about zero for every model before 2026
visuals:
  - {name: intelligence, chart: intelligence, targets: [x_video, linkedin_video, x_png, linkedin_png, blog_html]}
  - {name: terminal-bench, chart: terminal_bench, targets: [x_video, linkedin_video, x_png, linkedin_png, blog_html]}
