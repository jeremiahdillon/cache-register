# Exploration config (same schema as receipt.yaml; no short link — explorations never get one).
title: Who gets paid on OpenRouter?
sources: [openrouter_rankings, litellm_prices]
config:
  weeks: 13             # trailing complete weeks shown
  unpriced_flag: 0.03   # weeks with more unpriced tokens than this are shaded
  race_top_n: 8
visuals:
  - {name: share-lines, chart: line_chart, targets: [x_png, linkedin_png, blog_html]}
  - {name: share-race, chart: race, targets: [linkedin_video, x_video]}
