# Model groups for the mid-size open-weight analysis (hand-curated 2026-10-05; edit, then re-render).
#
# Keys are OpenRouter rankings permaslugs with `:free` stripped (free variants are merged).
# Open-weight models (weights published, or the lab has announced it will publish them) carry
# their size; analysis.py bands them by total parameters (see `bands`). Closed models carry a
# `group` (kept for reference) and are banded by developer: the slug's prefix, or `vendor:` for
# revealed stealth models. Params in billions.
#
# Long-tail models not listed here are banded by analysis.py's fallback rule (their lab if closed,
# else small open); the entries below cover every model with real volume plus the exceptions.
# `released` (reference only) is the model's release date, else its first day in the rankings.

bands:
  small_below_b: 100     # open, total params < this → small
  flagship_from_b: 1000  # open, total params >= this → flagship; in between → mid-size

# Reflection Beam (not on OpenRouter yet): 501B total / 23B active, Apache 2.0 weights announced for
# October 2026 — a mid-size open-weight model by this definition.

closed_groups: [frontier_large, frontier_small, other_closed, stealth_unknown]

